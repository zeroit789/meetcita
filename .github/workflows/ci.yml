# ES: Integración continua de Meetcita: en cada push y pull request instala las
#     dependencias, comprueba el formato (Pint), compila el front con pnpm, pasa
#     los tests y audita las dependencias (Composer y pnpm). Se prueba con la
#     versión mínima de PHP que exige composer.lock (8.4) y con la última (8.5).
#     Las actions van fijadas por SHA (la etiqueta queda en el comentario).
# EN: Meetcita continuous integration: on every push and pull request it
#     installs dependencies, checks formatting (Pint), builds the front end with
#     pnpm, runs the tests and audits dependencies (Composer and pnpm). It runs
#     on the minimum PHP version required by composer.lock (8.4) and the latest (8.5).
#     Actions are pinned by SHA (the tag is kept in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# ES: Solo lectura del repo: el workflow no publica nada.
# EN: Read-only repo access: the workflow publishes nothing.
permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ES: PHP con las extensiones que usa Laravel y SQLite para los tests.
      # EN: PHP with the extensions Laravel uses and SQLite for the tests.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # ES: .env de ejemplo con clave nueva (las cookies y la sesión la necesitan).
      # EN: Example .env with a fresh key (cookies and session need it).
      - name: Preparar .env / Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test

      # ES: pnpm toma la versión del campo packageManager de package.json.
      # EN: pnpm takes its version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ES: El build va antes de los tests: las vistas usan @vite y necesitan el manifiesto.
      # EN: Build runs before the tests: views use @vite and need the manifest.
      - name: pnpm build
        run: pnpm run build

      - name: Tests
        run: php artisan test

      - name: Composer audit
        run: composer audit

      - name: pnpm audit
        run: pnpm audit
